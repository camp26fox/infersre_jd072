[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "camp26fox-infersre_jd072"
version = "0.1.0"
description = "按给定权重把总额度分配到各项，报告超分配项与利用率"
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
authors = [{ name = "camp26fox" }]
keywords = ["ai", "llm", "cli", "analysis"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Topic :: Utilities",
]

[project.urls]
Homepage = "https://camp26fox.github.io"
Repository = "https://github.com/camp26fox/infersre_jd072"
Issues = "https://github.com/camp26fox/infersre_jd072/issues"

[project.scripts]
infersre_jd072 = "infersre_jd072:main"

[tool.setuptools]
py-modules = ["infersre_jd072"]
